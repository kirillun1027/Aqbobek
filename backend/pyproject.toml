[project]
name = "aqbobek-backend"
version = "0.1.0"
description = "FastAPI backend for the Aqbobek school portal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.3,<3.0",
  "httpx>=0.28,<0.29",
  "supabase>=2.18,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
